<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <title>PICK A NUMBER</title>
  </head>
  <body>
    <div class="container">
      <div class="box-range" id="box-range">
        <h1>Pick a number 123456</h1>
        <div class="box-container">
          <div class="box">1</div>
          <div class="box">2</div>
          <div class="box">3</div>
          <div class="box">4</div>
          <div class="box">5</div>
          <div class="box">6</div>
          <div class="box">7</div>
          <div class="box">8</div>
          <div class="box">9</div>
          <div class="box">10</div>
        </div>
      </div>

      <!-- DISPLAY IF ANY BOX SELECTED -->
      <div id="isBoxSelected" class="isBoxSelected"></div>

      <!-- DISPLAY NUMBER OF THE BOX SELECTED -->
      <div id="displayBoxNum" class="displayBoxNum"></div>

      <input type="button" class="btn" id="clearBtn" value="Clear" />
    </div>

    <!-- copyright info -->
    <div id="copy" class="copy"></div>

    <script src="script.js"></script>
  </body>
</html>
